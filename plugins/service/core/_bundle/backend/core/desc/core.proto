// @nexa $contract: "nexa.dev/source-comment/v1"
syntax = "proto3";

package core.v1;

message HealthRequest {}
message HealthResponse { bool ready = 1; }

message RegisterRequest {
  string tenant = 1;
  string username = 2;
  string password = 3;
  string email = 4;
  string display_name = 5;
}
message RegisterResponse { string account_id = 1; }

message LoginRequest {
  string username = 1;
  string password = 2;
}
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 tenant_id = 3;
  int64 member_id = 4;
}

message RefreshRequest { string refresh_token = 1; }
message CurrentSessionRequest {}
message CurrentSessionResponse {
  string user_id = 1;
  string username = 2;
  string real_name = 3;
  string avatar = 4;
  repeated string roles = 6;
  repeated string permission_codes = 7;
}
message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 tenant_id = 3;
  int64 member_id = 4;
}

message RevokeRequest {}
message RevokeResponse { bool revoked = 1; }
message LogoutRequest {}
message LogoutResponse {}
message GetAccessCodesRequest {}
message GetAccessCodesResponse { repeated string codes = 1; }
message GetUserInfoRequest {}
message UserInfoResponse {
  string user_id = 1;
  int64 member_id = 2;
  string username = 3;
  string email = 4;
  string real_name = 5;
  string avatar = 6;
  repeated string roles = 7;
  string desc = 8;
  string home_path = 9;
  string token = 10;
}
message RouteMeta {
  string title = 1;
  string icon = 2;
  bool keep_alive = 3;
  int64 order = 4;
  bool hide_in_menu = 5;
  bool hide_children_in_menu = 6;
}
message RouteItem {
  string name = 1;
  string path = 2;
  string component = 3;
  string redirect = 4;
  RouteMeta meta = 5;
  repeated RouteItem children = 6;
}
message GetAllMenusRequest {}
message GetAllMenusResponse { repeated RouteItem menus = 1; }

message CheckPermissionRequest {
  int64 tenant_id = 1;
  string subject_id = 2;
  string permission = 3;
}
message CheckPermissionResponse { bool allowed = 1; }

message UpdateAccountStatusRequest { string account_id = 1; string status = 2; }
message UpdateAccountStatusResponse { string status = 1; }
message ResetAccountPasswordRequest { string account_id = 1; string new_password = 2; }
message ResetAccountPasswordResponse { bool reset = 1; }

message IdentityAccountItem {
  string account_id = 1; string username = 2; string email = 3; string display_name = 4;
  string source_code = 5; string external_subject = 6; string status = 7;
}
message ListIdentityAccountsRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; }
message ListIdentityAccountsResponse { uint64 total = 1; repeated IdentityAccountItem items = 2; }
message GetIdentityAccountRequest { string account_id = 1; }
message GetIdentityAccountResponse { IdentityAccountItem item = 1; }

message ListTenantMembersRequest {
  int64 tenant_id = 1;
  string keyword = 2; string status = 3; uint32 limit = 4; uint32 offset = 5;
}
message TenantMemberItem {
  string member_id = 1; string account_id = 2; string username = 3; string email = 4;
  string display_name = 5; string source_code = 6; string external_subject = 7;
  string status = 8; repeated string role_codes = 9; uint64 version = 10;
}
message ListTenantMembersResponse {
  repeated TenantMemberItem items = 1;
  uint64 total = 2;
}
message GetTenantMemberRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; }
message GetTenantMemberResponse { TenantMemberItem item = 1; }
message UpdateTenantMemberStatusRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; string status = 4; uint64 expected_version = 5; }
message UpdateTenantMemberStatusResponse { string status = 1; uint64 version = 2; }
message ReplaceTenantMemberRolesRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; repeated string role_codes = 4; uint64 expected_version = 5; }
message ReplaceTenantMemberRolesResponse { repeated string role_codes = 1; uint64 version = 2; }

message ProvisionTenantRequest { string code = 1; string name = 2; string initial_admin_account_id = 3; }
message ProvisionTenantResponse { int64 tenant_id = 1; }
message TenantItem { int64 tenant_id = 1; string code = 2; string name = 3; string status = 4; uint64 version = 5; }
message ListTenantsRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; }
message ListTenantsResponse { uint64 total = 1; repeated TenantItem items = 2; }
message GetTenantRequest { int64 tenant_id = 1; }
message GetTenantResponse { TenantItem item = 1; }
message UpdateTenantRequest { int64 tenant_id = 1; string name = 2; uint64 expected_version = 3; }
message UpdateTenantResponse { TenantItem item = 1; }
message UpdateTenantStatusRequest { int64 tenant_id = 1; string status = 2; uint64 expected_version = 3; }
message UpdateTenantStatusResponse { string status = 1; uint64 version = 2; }

message CreateRoleRequest { int64 tenant_id = 1; string subject_id = 2; string code = 3; string name = 4; }
message CreateRoleResponse { string role_id = 1; uint64 version = 2; }
message RoleItem {
  string role_id = 1; string code = 2; string name = 3; string status = 4; bool managed = 5;
  repeated string permission_codes = 6; repeated string menu_codes = 7; uint64 version = 8;
}
message ListRolesRequest { int64 tenant_id = 1; string subject_id = 2; string keyword = 3; string status = 4; uint32 limit = 5; uint32 offset = 6; }
message ListRolesResponse { uint64 total = 1; repeated RoleItem items = 2; }
message GetRoleRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; }
message GetRoleResponse { RoleItem item = 1; }
message UpdateRoleRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; string name = 4; uint64 expected_version = 5; }
message UpdateRoleResponse { bool updated = 1; uint64 version = 2; }
message UpdateRoleStatusRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; string status = 4; uint64 expected_version = 5; }
message UpdateRoleStatusResponse { string status = 1; uint64 version = 2; }
message ReplaceRolePermissionsRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; repeated string permission_codes = 4; uint64 expected_version = 5; }
message ReplaceRolePermissionsResponse { repeated string permission_codes = 1; uint64 version = 2; }
message ReplaceRoleMenusRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; repeated string menu_codes = 4; uint64 expected_version = 5; }
message ReplaceRoleMenusResponse { repeated string menu_codes = 1; uint64 version = 2; }

message MenuItem {
  string menu_id = 1; string code = 2; string parent_code = 3; string name = 4; string path = 5;
  string component = 6; string icon = 7; int32 sort_order = 8; string source_id = 9; string status = 10;
}
message ListMenusRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; }
message ListMenusResponse { uint64 total = 1; repeated MenuItem items = 2; }
message GetMenuRequest { string code = 1; }
message GetMenuResponse { MenuItem item = 1; }

message PermissionItem {
  string permission_id = 1; string resource_code = 2; string code = 3; string name = 4;
  string description = 5; string source_id = 6; string status = 7;
}
message ListPermissionsRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; }
message ListPermissionsResponse { uint64 total = 1; repeated PermissionItem items = 2; }
message GetPermissionRequest { string code = 1; }
message GetPermissionResponse { PermissionItem item = 1; }

service CoreService {
  // @nexa auth: "none"
  // @nexa http.method: "GET"
  // @nexa http.path: "/health"
  rpc Health(HealthRequest) returns (HealthResponse);

  // @nexa auth: "none"
  // @nexa http.method: "POST"
  // @nexa http.path: "/auth/register"
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // @nexa auth: "none"
  // @nexa http.method: "POST"
  // @nexa http.path: "/auth/login"
  rpc Login(LoginRequest) returns (LoginResponse);

  // @nexa auth: "none"
  // @nexa http.method: "POST"
  // @nexa http.path: "/auth/refresh"
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  rpc CurrentSession(CurrentSessionRequest) returns (CurrentSessionResponse) {
  }

  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
  }

  rpc GetAccessCodes(GetAccessCodesRequest) returns (GetAccessCodesResponse) {
  }

  rpc GetUserInfo(GetUserInfoRequest) returns (UserInfoResponse) {
  }

  rpc GetAllMenus(GetAllMenusRequest) returns (GetAllMenusResponse) {
  }

  // @nexa auth: "required"
  // @nexa permission: "core.authorization.check"
  // @nexa http.method: "GET"
  // @nexa http.path: "/auth/permissions/{permission}"
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.identity.account.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/identity-accounts"
  rpc ListIdentityAccounts(ListIdentityAccountsRequest) returns (ListIdentityAccountsResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.identity.account.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/identity-accounts/{accountId}"
  rpc GetIdentityAccount(GetIdentityAccountRequest) returns (GetIdentityAccountResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.identity.account.status.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/identity-accounts/{accountId}/status"
  rpc UpdateAccountStatus(UpdateAccountStatusRequest) returns (UpdateAccountStatusResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.identity.account.password.reset"
  // @nexa http.method: "POST"
  // @nexa http.path: "/identity-accounts/{accountId}/password/reset"
  rpc ResetAccountPassword(ResetAccountPasswordRequest) returns (ResetAccountPasswordResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.user.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/users"
  rpc ListTenantMembers(ListTenantMembersRequest) returns (ListTenantMembersResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.user.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/users/{memberId}"
  rpc GetTenantMember(GetTenantMemberRequest) returns (GetTenantMemberResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.user.status.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/users/{memberId}/status"
  rpc UpdateTenantMemberStatus(UpdateTenantMemberStatusRequest) returns (UpdateTenantMemberStatusResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.user.roles.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/users/{memberId}/roles"
  rpc ReplaceTenantMemberRoles(ReplaceTenantMemberRolesRequest) returns (ReplaceTenantMemberRolesResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.tenant.create"
  // @nexa http.method: "POST"
  // @nexa http.path: "/tenants"
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.tenant.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/tenants"
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.tenant.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/tenants/{tenantId}"
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.tenant.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/tenants/{tenantId}"
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.tenant.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/tenants/{tenantId}/status"
  rpc UpdateTenantStatus(UpdateTenantStatusRequest) returns (UpdateTenantStatusResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.roles.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/roles"
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.roles.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/roles/{roleId}"
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.roles.create"
  // @nexa http.method: "POST"
  // @nexa http.path: "/roles"
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.roles.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/roles/{roleId}"
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.roles.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/roles/{roleId}/status"
  rpc UpdateRoleStatus(UpdateRoleStatusRequest) returns (UpdateRoleStatusResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.role_permissions.bind"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/roles/{roleId}/permissions"
  rpc ReplaceRolePermissions(ReplaceRolePermissionsRequest) returns (ReplaceRolePermissionsResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.roles.update"
  // @nexa http.method: "PUT"
  // @nexa http.path: "/roles/{roleId}/menus"
  rpc ReplaceRoleMenus(ReplaceRoleMenusRequest) returns (ReplaceRoleMenusResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.menu.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/menus"
  rpc ListMenus(ListMenusRequest) returns (ListMenusResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.menu.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/menus/{code}"
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.permissions.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/permissions"
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);

  // @nexa auth: "required"
  // @nexa permission: "nexa.auth.permissions.read"
  // @nexa http.method: "GET"
  // @nexa http.path: "/permissions/{code}"
  rpc GetPermission(GetPermissionRequest) returns (GetPermissionResponse);
}
