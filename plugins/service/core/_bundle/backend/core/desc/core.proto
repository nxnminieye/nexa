syntax = "proto3";

package core.v1;

import "nexa/protocol/v1/options.proto";

message HealthRequest {}
message HealthResponse { bool ready = 1; }

message RegisterRequest {
  string tenant = 1;
  string username = 2;
  string password = 3;
  string email = 4;
  string display_name = 5;
  string request_id = 6;
  string trace_id = 7;
}
message RegisterResponse { string account_id = 1; }

message LoginRequest {
  string tenant = 1;
  string username = 2;
  string password = 3;
  string request_id = 4;
  string trace_id = 5;
}
message LoginResponse {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshRequest {
  string refresh_token = 1;
  string request_id = 2;
  string trace_id = 3;
}
message RefreshResponse {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RevokeRequest {
  string session_id = 1;
  string request_id = 2;
  string trace_id = 3;
}
message RevokeResponse { bool revoked = 1; }

message CheckPermissionRequest {
  int64 tenant_id = 1;
  string subject_id = 2;
  string permission = 3;
}
message CheckPermissionResponse { bool allowed = 1; }

message UpdateAccountStatusRequest { string account_id = 1; string status = 2; string request_id = 3; string trace_id = 4; }
message UpdateAccountStatusResponse { string status = 1; }
message ResetAccountPasswordRequest { string account_id = 1; string new_password = 2; string request_id = 3; string trace_id = 4; }
message ResetAccountPasswordResponse { bool reset = 1; }

message ListTenantMembersRequest {
  int64 tenant_id = 1;
}
message ListTenantMembersResponse { repeated string member_ids = 1; repeated string account_ids = 2; repeated string statuses = 3; repeated uint64 versions = 4; }
message UpdateTenantMemberStatusRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; string status = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message UpdateTenantMemberStatusResponse { string status = 1; uint64 version = 2; }
message ReplaceTenantMemberRolesRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; repeated string role_codes = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message ReplaceTenantMemberRolesResponse { repeated string role_codes = 1; uint64 version = 2; }

message ProvisionTenantRequest { string code = 1; string name = 2; string initial_admin_account_id = 3; string request_id = 4; string trace_id = 5; }
message ProvisionTenantResponse { int64 tenant_id = 1; }
message UpdateTenantStatusRequest { int64 tenant_id = 1; string status = 2; uint64 expected_version = 3; string request_id = 4; string trace_id = 5; }
message UpdateTenantStatusResponse { string status = 1; uint64 version = 2; }

message CreateRoleRequest { int64 tenant_id = 1; string subject_id = 2; string code = 3; string name = 4; string request_id = 5; string trace_id = 6; }
message CreateRoleResponse { string role_id = 1; uint64 version = 2; }
message UpdateRoleRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; string name = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message UpdateRoleResponse { bool updated = 1; uint64 version = 2; }
message UpdateRoleStatusRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; string status = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message UpdateRoleStatusResponse { string status = 1; uint64 version = 2; }
message ReplaceRolePermissionsRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; repeated string permission_codes = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message ReplaceRolePermissionsResponse { repeated string permission_codes = 1; uint64 version = 2; }
message ReplaceRoleMenusRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; repeated string menu_codes = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message ReplaceRoleMenusResponse { repeated string menu_codes = 1; uint64 version = 2; }

