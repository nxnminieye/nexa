      permission: "core.authorization.check"
      request_fields: { http_field: "permission" rpc_field: "permission" }
      response_fields: { rpc_field: "allowed" http_field: "allowed" }
    };
  }

  rpc ListIdentityAccounts(ListIdentityAccountsRequest) returns (ListIdentityAccountsResponse) {
    option (nexa.protocol.v1.rpc_context) = { context_fields: { source: REQUEST_ID rpc_field: "request_id" } context_fields: { source: TRACE_ID rpc_field: "trace_id" } };
