syntax = "proto3";

package core.v1;

import "nexa/protocol/v1/options.proto";

message HealthRequest {}
message HealthResponse { bool ready = 1; }

message RegisterRequest {
  string tenant = 1;
  string username = 2;
  string password = 3;
  string email = 4;
  string display_name = 5;
  string request_id = 6;
  string trace_id = 7;
}
message RegisterResponse { string account_id = 1; }

message LoginRequest {
  string tenant = 1;
  string username = 2;
  string password = 3;
  string request_id = 4;
  string trace_id = 5;
}
message LoginResponse {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshRequest {
  string refresh_token = 1;
  string request_id = 2;
  string trace_id = 3;
}
message RefreshResponse {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RevokeRequest {
  string session_id = 1;
  string request_id = 2;
  string trace_id = 3;
}
message RevokeResponse { bool revoked = 1; }

message CheckPermissionRequest {
  int64 tenant_id = 1;
  string subject_id = 2;
  string permission = 3;
}
message CheckPermissionResponse { bool allowed = 1; }

message UpdateAccountStatusRequest { string account_id = 1; string status = 2; string request_id = 3; string trace_id = 4; }
message UpdateAccountStatusResponse { string status = 1; }
message ResetAccountPasswordRequest { string account_id = 1; string new_password = 2; string request_id = 3; string trace_id = 4; }
message ResetAccountPasswordResponse { bool reset = 1; }

message IdentityAccountItem {
  string account_id = 1; string username = 2; string email = 3; string display_name = 4;
  string source_code = 5; string external_subject = 6; string status = 7;
}
message ListIdentityAccountsRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; string request_id = 5; string trace_id = 6; }
message ListIdentityAccountsResponse { uint64 total = 1; repeated IdentityAccountItem items = 2; }
message GetIdentityAccountRequest { string account_id = 1; string request_id = 2; string trace_id = 3; }
message GetIdentityAccountResponse { IdentityAccountItem item = 1; }

message ListTenantMembersRequest {
  int64 tenant_id = 1;
  string keyword = 2; string status = 3; uint32 limit = 4; uint32 offset = 5;
  string request_id = 6; string trace_id = 7;
}
message TenantMemberItem {
  string member_id = 1; string account_id = 2; string username = 3; string email = 4;
  string display_name = 5; string source_code = 6; string external_subject = 7;
  string status = 8; repeated string role_codes = 9; uint64 version = 10;
}
message ListTenantMembersResponse {
  repeated string member_ids = 1; repeated string account_ids = 2; repeated string statuses = 3; repeated uint64 versions = 4;
  repeated TenantMemberItem items = 5; uint64 total = 6;
}
message GetTenantMemberRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; string request_id = 4; string trace_id = 5; }
message GetTenantMemberResponse { TenantMemberItem item = 1; }
message UpdateTenantMemberStatusRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; string status = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message UpdateTenantMemberStatusResponse { string status = 1; uint64 version = 2; }
message ReplaceTenantMemberRolesRequest { int64 tenant_id = 1; string subject_id = 2; string member_id = 3; repeated string role_codes = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message ReplaceTenantMemberRolesResponse { repeated string role_codes = 1; uint64 version = 2; }

message ProvisionTenantRequest { string code = 1; string name = 2; string initial_admin_account_id = 3; string request_id = 4; string trace_id = 5; }
message ProvisionTenantResponse { int64 tenant_id = 1; }
message TenantItem { int64 tenant_id = 1; string code = 2; string name = 3; string status = 4; uint64 version = 5; }
message ListTenantsRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; string request_id = 5; string trace_id = 6; }
message ListTenantsResponse { uint64 total = 1; repeated TenantItem items = 2; }
message GetTenantRequest { int64 tenant_id = 1; string request_id = 2; string trace_id = 3; }
message GetTenantResponse { TenantItem item = 1; }
message UpdateTenantRequest { int64 tenant_id = 1; string name = 2; uint64 expected_version = 3; string request_id = 4; string trace_id = 5; }
message UpdateTenantResponse { TenantItem item = 1; }
message UpdateTenantStatusRequest { int64 tenant_id = 1; string status = 2; uint64 expected_version = 3; string request_id = 4; string trace_id = 5; }
message UpdateTenantStatusResponse { string status = 1; uint64 version = 2; }

message CreateRoleRequest { int64 tenant_id = 1; string subject_id = 2; string code = 3; string name = 4; string request_id = 5; string trace_id = 6; }
message CreateRoleResponse { string role_id = 1; uint64 version = 2; }
message RoleItem {
  string role_id = 1; string code = 2; string name = 3; string status = 4; bool managed = 5;
  repeated string permission_codes = 6; repeated string menu_codes = 7; uint64 version = 8;
}
message ListRolesRequest { int64 tenant_id = 1; string subject_id = 2; string keyword = 3; string status = 4; uint32 limit = 5; uint32 offset = 6; string request_id = 7; string trace_id = 8; }
message ListRolesResponse { uint64 total = 1; repeated RoleItem items = 2; }
message GetRoleRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; string request_id = 4; string trace_id = 5; }
message GetRoleResponse { RoleItem item = 1; }
message UpdateRoleRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; string name = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message UpdateRoleResponse { bool updated = 1; uint64 version = 2; }
message UpdateRoleStatusRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; string status = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message UpdateRoleStatusResponse { string status = 1; uint64 version = 2; }
message ReplaceRolePermissionsRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; repeated string permission_codes = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message ReplaceRolePermissionsResponse { repeated string permission_codes = 1; uint64 version = 2; }
message ReplaceRoleMenusRequest { int64 tenant_id = 1; string subject_id = 2; string role_id = 3; repeated string menu_codes = 4; uint64 expected_version = 5; string request_id = 6; string trace_id = 7; }
message ReplaceRoleMenusResponse { repeated string menu_codes = 1; uint64 version = 2; }

message MenuItem {
  string menu_id = 1; string code = 2; string parent_code = 3; string name = 4; string path = 5;
  string component = 6; string icon = 7; int32 sort_order = 8; string source_id = 9; string status = 10;
}
message ListMenusRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; string request_id = 5; string trace_id = 6; }
message ListMenusResponse { uint64 total = 1; repeated MenuItem items = 2; }
message GetMenuRequest { string code = 1; string request_id = 2; string trace_id = 3; }
message GetMenuResponse { MenuItem item = 1; }

message PermissionItem {
  string permission_id = 1; string resource_code = 2; string code = 3; string name = 4;
  string description = 5; string source_id = 6; string status = 7;
}
message ListPermissionsRequest { string keyword = 1; string status = 2; uint32 limit = 3; uint32 offset = 4; string request_id = 5; string trace_id = 6; }
message ListPermissionsResponse { uint64 total = 1; repeated PermissionItem items = 2; }
message GetPermissionRequest { string code = 1; string request_id = 2; string trace_id = 3; }
message GetPermissionResponse { PermissionItem item = 1; }

service CoreService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (nexa.protocol.v1.http_proxy) = {
      operation_id: "core.health"
      method: GET
      path: "/health"
      auth: { mode: NONE }
      response_fields: { rpc_field: "ready" http_field: "ready" }
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (nexa.protocol.v1.rpc_context) = {
      context_fields: { source: REQUEST_ID rpc_field: "request_id" }
      context_fields: { source: TRACE_ID rpc_field: "trace_id" }
    };
    option (nexa.protocol.v1.http_proxy) = {
      operation_id: "core.auth.register"
      method: POST
      path: "/auth/register"
      auth: { mode: NONE }
      request_fields: { http_field: "tenant" rpc_field: "tenant" }
      request_fields: { http_field: "username" rpc_field: "username" }
      request_fields: { http_field: "password" rpc_field: "password" }
      request_fields: { http_field: "email" rpc_field: "email" }
      request_fields: { http_field: "displayName" rpc_field: "display_name" }
      response_fields: { rpc_field: "account_id" http_field: "accountId" }
      errors: { match: { domain: "core" code: "conflict" } project: { domain: "api" code: "account_conflict" http_status: 409 } }
      errors: { match: { domain: "core" code: "invalid_input" } project: { domain: "api" code: "invalid_input" http_status: 400 } }
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
